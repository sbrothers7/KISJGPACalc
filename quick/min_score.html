<!DOCTYPE html>
<html lang="en">

<head>
    <title>Minimum Score</title>
    <base href="https://sbrothers7.github.io/KISJGPACalc/">
    <script src="js/head-common.js"></script>
    <link rel="stylesheet" type="text/css" href="css/sidebar.css">
</head>

<body>
    <div class="sidebar">
        <div>
            <h2><a href="index.html" class="nav-title">Home</a></h2>
            <h3>Minimum Score Calculations</h3>
            <p class="desc">"What score do I need to get ___?"</p>
        </div>

        <div class="config">
            <p class="title">Configuration</p>
            <input type="checkbox" id="privacy">
            <label for="privacy">Privacy Mode</label>
            <br>
            <input type="checkbox" id="rounding">
            <label for="rounding">Round Scores</label>
            <br>
            <p class="desc"><i>Sets the boundary for an A to 92.5 instead of 93, and so on.</i></p>
        </div>
        <p id="watermark"><i>Copyright © 2026 Siwool Um</i></p>
    </div>
    <sidebar-anchor></sidebar-anchor>

    <div class="main">
        <div class="container">
            <div class="section asmt">
                <table id="asmt" class="data">
                    <caption>Assessments</caption>
                    <tr>
                        <th>Formative AVG</th>
                        <th>Summative AVG</th>
                        <th>Deisred Grade</th>
                    </tr>
                </table>

                <div class="header">
                    <div>
                        <p class="title">Assessment Type</p>
                        <input id="f" type="radio" name="type">
                        <label for="f">Formative</label>
                        <br>
                        <input id="s" type="radio" name="type">
                        <label for="s">Summative</label>
                        <br>
                        <input id="final" type="radio" name="type">
                        <label for="final">Final Exam</label>
                    </div>
                    <div>
                        <p class="title">Course Type</p>
                        <input id="c" type="checkbox">
                        <label for="c">Core Subject/AP S1</label>
                    </div>
                </div>

                <table class="result-table result">
                    <tr>
                        <th>Result</th>
                    </tr>
                    <tr>
                        <td id="asmt-result" class="result-td"></td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
    <dm-button></dm-button>
    <datalist id="subjects"></datalist>

</body>

<script src="js/components.js"></script>
<script src="js/global.js"></script>
<script src="js/calc.js"></script>

<script>
    // init
    addRow("asmt", 3, ["number", "number", "text"]);
    makeNavTable("asmt");

    const asmt = document.getElementById("asmt");
    const f = document.getElementById("f");
    const s = document.getElementById("s");
    const final = document.getElementById("final");
    const c = document.getElementById("c");
    const roundq = document.getElementById("rounding");
    roundq.checked = true; // default set to true
    s.checked = true;
    final.disabled = true;
    let round = roundq.checked;

    function handleDesired(desired) {
        if (isNaN(parseFloat(desired))) desired = letterToPercent(desired);
        if (roundq.checked) {
            desired = Math.round(desired) - 0.5; // account for decimal values 
        }
        return desired;
    }

    function calcMin() {
        const data = getTableData(asmt)[0];
        const curf = data[0].value;
        const curs = data[1].value;
        let desired = handleDesired(data[2].value);
        let res;

        if (f.checked) {
            if (c.checked) res = (80 * desired - 60 * curs) / 20
            else res = (100 * desired - 80 * curs) / 20;
        }
        else if (s.checked) {
            if (c.checked) res = (80 * desired - 20 * curf) / 60
            else res = (100 * desired - 20 * curs) / 80;
        }
        else if (final.checked) {
            res = (100 * desired - 60 * curs - 20 * curf) / 20;
        }

        const result_cell = document.getElementById("asmt-result");

        // console.log(res);
        if (!isNaN(res)) {
            result_cell.innerHTML = res.toFixed(2);
            if (res > 100) result_cell.innerHTML += " (Impossible)";
        }
        else result_cell.innerHTML = "";
    }

    roundq.addEventListener("change", () => {
        calcMin();
    });

    document.querySelector(".asmt").addEventListener("change", () => {
        calcMin();
    });

    c.addEventListener("change", () => {
        if (c.checked) {
            final.disabled = false;
        }
        else {
            final.disabled = true;
            f.checked = true;
            final.checked = false;
        }
    });
</script>

</html>
