<!DOCTYPE html>
<html lang="en">

<head>
	<title>GPA, 1 Year</title>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=0.9">
	<meta http-equiv="Pragma" content="no-cache">

	<link rel="stylesheet" type="text/css" href="../css/global.css">
	<link rel="stylesheet" type="text/css" href="../css/dark.css">
	<link rel="stylesheet" type="text/css" href="../css/sidebar.css">

	<link rel="icon" href="../img/icon.png" type="image/x-icon">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
	<div class="sidebar">
		<div>
			<h2><a href="../index.html">Home</a></h2>
			<h3>GPA Calculation</h3>
			<p><i>Percentages and letter grades are both supported!</i></p>

			<div>
				<hr>
				<h3>Configuration</h3>
				<input type="checkbox" id="privacy">
				<label for="privacy">Privacy Mode</label>
			</div>

			<div class="inlineflex">
				<p>Add</p>
				<input id="addValue" class="addRow" type="number" maxlength="2" value="1" min="1" max="10">
				<p>Row(s)</p>
				<button style="padding: 0.3em 0.4em;" onclick="addRows('calc', 'addValue')">↵</button>
			</div>
		</div>
		<p id="watermark"><i>Copyright © 2026 Siwool Um</i></p>
	</div>
	<div class="sidebar-anchor">
		<button class="toggle-btn" onclick="toggleSidebar()">
			<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
				class="bi bi-chevron-compact-left closeicon" viewBox="0 0 16 16">
				<path fill-rule="evenodd"
					d="M9.224 1.553a.5.5 0 0 1 .223.67L6.56 8l2.888 5.776a.5.5 0 1 1-.894.448l-3-6a.5.5 0 0 1 0-.448l3-6a.5.5 0 0 1 .67-.223" />
			</svg>
			<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
				class="bi bi-chevron-compact-right expandicon hidden" viewBox="0 0 16 16">
				<path fill-rule="evenodd"
					d="M6.776 1.553a.5.5 0 0 1 .671.223l3 6a.5.5 0 0 1 0 .448l-3 6a.5.5 0 1 1-.894-.448L9.44 8 6.553 2.224a.5.5 0 0 1 .223-.671" />
			</svg>
		</button>
	</div>

	<div class="main">
		<div class="container">
			<div class="section">
				<table id="calc">
					<caption>1 Year GPA</caption>
					<tr>
						<th>Subject</th>
						<th>Grade</th>
					</tr>
				</table>

				<div class="header">
					<table class="result-table">
						<tr>
							<th>GPA</th>
						</tr>
						<tr>
							<td id="gpa" class="result"></td>
						</tr>
					</table>
					<button class="clearbtn" onclick="clearSem(1)">Clear All</button>
				</div>
			</div>
		</div>
	</div>

	<button id="darkmode" onclick="toggleDarkMode()">
		<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
			class="bi bi-moon-fill indicatorMoon" viewBox="0 0 16 16">
			<path
				d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278" />
		</svg>
		<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
			class="bi bi-brightness-high-fill indicatorSun" viewBox="0 0 16 16">
			<path
				d="M12 8a4 4 0 1 1-8 0 4 4 0 0 1 8 0M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708" />
		</svg>
	</button>
</body>

<script src="../js/global.js"></script>
<script src="../js/calc.js"></script>
<script>
	const final = document.getElementById("finalcheck");
	const ap = document.getElementById("apcheck");
	const fullyear = document.getElementById("yearcheck");
	const privacy = document.getElementById("privacy");

	const finalTable = document.getElementById("final");
	const s2final = document.getElementById("s2final");

	function updateFinalTable() {
		if (final.checked) finalTable.classList.remove("hidden");
		else finalTable.classList.add("hidden");
	}

	// init
	for (let i = 0; i < 8; i++) { addRow("calc"); };

	makeNavTable("calc");

	// EventListeners
	privacy.addEventListener("change", togglePrivacy);

	document.getElementById("addValue").addEventListener("keydown", (e) => {
		if (e.key == "Enter") {
			addRows('calc', 'addValue');
		}
	});
</script>

</html>
