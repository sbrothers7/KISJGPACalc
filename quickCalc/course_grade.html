<!DOCTYPE html>
<html lang="en">

<head>
	<title>Course Grade</title>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=0.8">
	<meta http-equiv="Pragma" content="no-cache">

	<link rel="stylesheet" type="text/css" href="../css/global.css">
	<link rel="stylesheet" type="text/css" href="../css/dark.css">
	<link rel="stylesheet" type="text/css" href="../css/sidebar.css">

	<link rel="icon" href="../img/icon.png" type="image/x-icon">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
	<div class="sidebar">
		<div>
			<h2><a href="../index.html">Home</a></h2>
			<h3>Single Course Calculations</h3>
			<p><i>Enter percentages only.</i></p>
		</div>

		<div>
			<hr>
			<h3>Configuration</h3>
			<input type="checkbox" id="finalcheck">
			<label for="finalcheck">Finals</label>
			<br>
			<input type="checkbox" id="apcheck">
			<label for="apcheck">AP</label>
			<br>
			<input type="checkbox" id="yearcheck">
			<label for="yearcheck">Full Year</label>
			<br>
			<input type="checkbox" id="privacy">
			<label for="privacy">Privacy Mode</label>
		</div>

		<div class="inlineflex">
			<p>Add</p>
			<input id="addValue" class="addRow" type="number" maxlength="2" value="1" min="1" max="10">
			<p>Row(s)</p>
			<button style="padding: 0.3em 0.4em;"
				onclick="addRows('s1', 'addValue'); addRows('s2', 'addValue')">↵</button>
		</div>
		<p id="watermark"><i>Copyright © 2026 Siwool Um</i></p>
	</div>
	<div class="sidebar-anchor">
		<button class="toggle-btn" onclick="toggleSidebar()">
			<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
				class="bi bi-chevron-compact-left closeicon" viewBox="0 0 16 16">
				<path fill-rule="evenodd"
					d="M9.224 1.553a.5.5 0 0 1 .223.67L6.56 8l2.888 5.776a.5.5 0 1 1-.894.448l-3-6a.5.5 0 0 1 0-.448l3-6a.5.5 0 0 1 .67-.223" />
			</svg>
			<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
				class="bi bi-chevron-compact-right expandicon hidden" viewBox="0 0 16 16">
				<path fill-rule="evenodd"
					d="M6.776 1.553a.5.5 0 0 1 .671.223l3 6a.5.5 0 0 1 0 .448l-3 6a.5.5 0 1 1-.894-.448L9.44 8 6.553 2.224a.5.5 0 0 1 .223-.671" />
			</svg>
		</button>
	</div>

	<div class="main">
		<div class="container">
			<div class="section">
				<table id="s1">
					<caption>Semester 1</caption>
					<tr>
						<th>Formative</th>
						<th>Summative</th>
					</tr>
				</table>

				<table>
					<tr>
						<td><input id="s1f" readonly></td>
						<td><input id="s1s" readonly></td>
					</tr>
				</table>

				<div class="header">
					<table class="result-table">
						<tr>
							<th>Domain</th>
						</tr>
						<tr>
							<td id="s1domain" class="result"></td>
						</tr>
					</table>
					<button class="clearbtn" onclick="clearSem(1)">Clear All</button>
				</div>
			</div>

			<div id="s2container" class="hidden section">
				<table id="s2">
					<caption>Semester 2</caption>
					<tr>
						<th>Formative</th>
						<th>Summative</th>
					</tr>
				</table>

				<table>
					<tr>
						<td><input id="s2f" readonly></td>
						<td><input id="s2s" readonly></td>
					</tr>
				</table>

				<div class="header">
					<table class="result-table">
						<tr>
							<th>Domain</th>
						</tr>
						<tr>
							<td id="s2domain" class="result"></td>
						</tr>
					</table>
					<button class="clearbtn" onclick="clearSem(2)">Clear All</button>
				</div>

			</div>
		</div>

		<div class="section center">
			<table id="final" class="hidden">
				<caption>Finals</caption>
				<tr>
					<th>Final S1</th>
					<th id="s2finalh" class="hidden">Final S2</th>
				</tr>
				<tr>
					<td><input id="s1final"></td>
					<td id="s2finalcell" class="hidden"><input id="s2final"></td>
				</tr>
			</table>
		</div>
	</div>

	<button id="darkmode" onclick="toggleDarkMode()">
		<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
			class="bi bi-moon-fill indicatorMoon hidden" viewBox="0 0 16 16">
			<path
				d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278" />
		</svg>
		<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
			class="bi bi-brightness-high-fill indicatorSun hidden" viewBox="0 0 16 16">
			<path
				d="M12 8a4 4 0 1 1-8 0 4 4 0 0 1 8 0M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708" />
		</svg>
		<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
			class="bi bi-gear-wide-connected indicatorSystem hidden" viewBox="0 0 16 16">
			<path
				d="M7.068.727c.243-.97 1.62-.97 1.864 0l.071.286a.96.96 0 0 0 1.622.434l.205-.211c.695-.719 1.888-.03 1.613.931l-.08.284a.96.96 0 0 0 1.187 1.187l.283-.081c.96-.275 1.65.918.931 1.613l-.211.205a.96.96 0 0 0 .434 1.622l.286.071c.97.243.97 1.62 0 1.864l-.286.071a.96.96 0 0 0-.434 1.622l.211.205c.719.695.03 1.888-.931 1.613l-.284-.08a.96.96 0 0 0-1.187 1.187l.081.283c.275.96-.918 1.65-1.613.931l-.205-.211a.96.96 0 0 0-1.622.434l-.071.286c-.243.97-1.62.97-1.864 0l-.071-.286a.96.96 0 0 0-1.622-.434l-.205.211c-.695.719-1.888.03-1.613-.931l.08-.284a.96.96 0 0 0-1.186-1.187l-.284.081c-.96.275-1.65-.918-.931-1.613l.211-.205a.96.96 0 0 0-.434-1.622l-.286-.071c-.97-.243-.97-1.62 0-1.864l.286-.071a.96.96 0 0 0 .434-1.622l-.211-.205c-.719-.695-.03-1.888.931-1.613l.284.08a.96.96 0 0 0 1.187-1.186l-.081-.284c-.275-.96.918-1.65 1.613-.931l.205.211a.96.96 0 0 0 1.622-.434zM12.973 8.5H8.25l-2.834 3.779A4.998 4.998 0 0 0 12.973 8.5m0-1a4.998 4.998 0 0 0-7.557-3.779l2.834 3.78zM5.048 3.967l-.087.065zm-.431.355A4.98 4.98 0 0 0 3.002 8c0 1.455.622 2.765 1.615 3.678L7.375 8zm.344 7.646.087.065z" />
		</svg>
	</button>
</body>

<script src="../js/global.js"></script>
<script src="../js/calc.js"></script>
<script>
	const final = document.getElementById("finalcheck");
	const ap = document.getElementById("apcheck");
	const fullyear = document.getElementById("yearcheck");
	const privacy = document.getElementById("privacy");

	const finalTable = document.getElementById("final");
	const s2final = document.getElementById("s2final");

	function updateFinalTable() {
		if (final.checked) finalTable.classList.remove("hidden");
		else finalTable.classList.add("hidden");
	}

	// init
	setupSemester("s1", 1);
	setupSemester("s2", 2);
	for (let i = 0; i < 6; i++) { addRow("s1"); addRow("s2") };

	makeNavTable("s1");
	makeNavTable("s2");

	// EventListeners
	final.addEventListener("change", updateFinalTable);

	finalTable.addEventListener("change", () => {
		calcDomainSem(1);
		calcDomainSem(2);
	});

	ap.addEventListener("change", () => {
		if (ap.checked) {
			final.checked = true;
			final.disabled = true;
			s2final.value = "No finals for S2";
			s2final.disabled = true;
		} else {
			final.disabled = false;
			s2final.value = "";
			s2final.disabled = false;
		}
		updateFinalTable();
	});

	fullyear.addEventListener("change", () => {
		document.getElementById("s2finalh").classList.toggle("hidden");
		document.getElementById("s2finalcell").classList.toggle("hidden");
		document.getElementById("s2container").classList.toggle("hidden");
	});

	privacy.addEventListener("change", togglePrivacy);

	document.getElementById("addValue").addEventListener("keydown", (e) => {
		if (e.key == "Enter") {
			addRows('s1', 'addValue');
			addRows('s2', 'addValue');
		}
	});
</script>

<style>
	#final {
		width: 21em;
	}

	div,
	table,
	td,
	th {
		opacity: 1;
		transition: opacity 0.3s, display 0.3s allow-discrete;

	}

	div.hidden,
	table.hidden,
	td.hidden,
	th.hidden {
		display: none;
		opacity: 0;
	}

	@starting-style {

		div,
		table,
		td,
		th {
			opacity: 0;
		}
	}

	@media (max-width: 1100px) {
		.container {
			flex-direction: column;
			align-items: center;
		}

		.container>.section {
			width: max(60%, 325px);
			min-width: 0;
			margin: 0;
		}
	}

	.clearbtn {
		width: 8em;
	}
</style>

</html>
